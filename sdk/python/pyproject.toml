[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steplock"
version = "1.1.0"
description = "StepLock: Deterministic State Proxy and Content-Addressable Storage for Multi-Step AI Agents"
readme = "README.md"
authors = [{ name = "StepLock Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
langchain = ["langchain-core>=0.1.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]
